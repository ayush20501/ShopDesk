<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopDesk</title>
<style>
  :root {
    --bg:#f5f6f9; --card:#ffffff; --text:#1b2130; --muted:#6a7387; --line:#e3e6ee;
    --accent:#2f5bea; --accent-soft:#e9efff; --on-accent:#ffffff;
    --ok:#12804a; --ok-soft:#e3f6ec; --warn:#9a5b00; --warn-soft:#fff3d6; --bad:#b42318; --bad-soft:#fde8e6;
    --bot:#ffffff; --shadow:0 1px 2px rgba(20,30,60,.06), 0 4px 14px rgba(20,30,60,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1218; --card:#181c25; --text:#e8ebf2; --muted:#98a2b3; --line:#2a303c;
      --accent:#6ea0ff; --accent-soft:#1d2a47; --on-accent:#0b1220;
      --ok:#75e0a7; --ok-soft:#0e3322; --warn:#fec84b; --warn-soft:#3a2d0b; --bad:#fda29b; --bad-soft:#40181a;
      --bot:#1c212b; --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
  button, input, select { font:inherit; color:inherit; }

  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .logo { width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:700; }
  header h1 { font-size:17px; margin:0; line-height:1.1; }
  header small { color:var(--muted); display:block; font-size:12px; }
  .grow { flex:1; }
  header label { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
  select { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 10px; }

  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; padding:16px; }
  @media (max-width: 880px) {
    body { overflow:auto; }
    main { grid-template-columns:1fr; flex:none; }
    .chat { height:78vh; }
  }

  .chat { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:0; }
  #log { flex:1; min-height:0; overflow-y:auto; padding:22px 24px 8px; display:flex; flex-direction:column; gap:18px; }

  .welcome { margin:auto; text-align:center; padding:30px 10px; max-width:520px; }
  .welcome h2 { margin:0 0 6px; font-size:22px; }
  .welcome p { margin:0 0 18px; color:var(--muted); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chip { background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 13px; cursor:pointer; font-size:13.5px; }
  .chip:hover { border-color:var(--accent); background:var(--accent-soft); }

  .row { display:flex; gap:10px; align-items:flex-start; }
  .row.me { justify-content:flex-end; }
  .avatar { flex:none; width:30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center; font-weight:700; font-size:13px; }
  .bubble { max-width:min(860px, 90%); overflow-wrap:anywhere; }
  .me .bubble { background:var(--accent); color:var(--on-accent); padding:9px 14px; border-radius:16px 16px 4px 16px; white-space:pre-wrap; }
  .bot .bubble { background:var(--bot); border:1px solid var(--line); padding:12px 15px; border-radius:4px 16px 16px 16px; }

  .text p { margin:0 0 8px; }
  .text p:last-child, .text ul:last-child, .text ol:last-child { margin-bottom:0; }
  .text ul, .text ol { margin:6px 0 8px; padding-left:20px; }
  .text li { margin:3px 0; }
  .text strong { font-weight:650; }
  .text.streaming > :last-child::after { content:"\25CF"; font-size:9px; margin-left:4px; color:var(--accent); animation:pulse 1s ease-in-out infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }

  .thinking { font-size:13.5px; color:var(--muted); }
  .thinking .title { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-weight:600; color:var(--text); }
  .dots span { display:inline-block; width:5px; height:5px; margin-right:3px; border-radius:50%; background:var(--accent); animation:bounce 1.1s infinite; }
  .dots span:nth-child(2) { animation-delay:.15s; } .dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes bounce { 0%,80%,100% { transform:translateY(0); opacity:.4; } 40% { transform:translateY(-4px); opacity:1; } }
  .step { display:flex; align-items:baseline; gap:8px; padding:2px 0; animation:fade .25s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
  .mark { flex:none; width:14px; height:14px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--accent); animation:spin .8s linear infinite; position:relative; top:2px; }
  .step.done .mark { animation:none; border:none; background:var(--ok-soft); top:2px; }
  .step.done .mark::after { content:"\2713"; position:absolute; inset:0; color:var(--ok); font-size:10px; line-height:14px; text-align:center; font-weight:700; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .step .detail { color:var(--muted); opacity:.85; }
  .step .detail::before { content:"\00B7"; margin:0 6px 0 2px; }

  .status { display:none; align-items:center; gap:8px; margin-top:8px; font-size:12.5px; color:var(--muted); }
  .status.on { display:flex; }

  .extras { display:flex; flex-direction:column; gap:10px; }
  .extras:not(:empty) { margin-top:10px; }
  .sources { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted); }
  .src { border:1px solid var(--line); border-radius:999px; padding:1px 9px; background:var(--bg); }

  .action-card { border:1px solid var(--line); border-radius:12px; padding:11px 13px; background:var(--bg); }
  .action-card .top { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .action-card .title { font-weight:650; }
  .action-card .sub { color:var(--muted); font-size:13px; margin-top:2px; }
  .pill { font-size:12px; font-weight:600; border-radius:999px; padding:2px 10px; background:var(--warn-soft); color:var(--warn); }
  .pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.bad { background:var(--bad-soft); color:var(--bad); }

  .error { color:var(--bad); }

  form { display:flex; gap:10px; padding:12px 14px 14px; border-top:1px solid var(--line); }
  form input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:11px 14px; outline:none; }
  form input:focus { border-color:var(--accent); }
  .send { background:var(--accent); color:var(--on-accent); border:none; border-radius:12px; padding:0 20px; font-weight:600; cursor:pointer; }
  .send:disabled { opacity:.5; cursor:default; }

  aside { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:var(--shadow); min-height:0; overflow-y:auto; }
  aside h2 { margin:0 0 4px; font-size:15px; }
  aside .hint { margin:0 0 12px; color:var(--muted); font-size:12.5px; }
  .approval { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:10px; background:var(--bg); }
  .approval .who { font-size:12px; color:var(--muted); }
  .approval .what { margin:3px 0 8px; font-weight:600; }
  .approval .btns { display:flex; gap:8px; }
  .approval button { flex:1; border:1px solid var(--line); background:var(--card); border-radius:10px; padding:7px 0; cursor:pointer; font-weight:600; }
  .approval button.go { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .approval button:disabled { opacity:.5; cursor:default; }
  .empty { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="logo">S</div>
  <h1>ShopDesk</h1>
  <div class="grow"></div>
  <label>Signed in as <select id="customer"></select></label>
</header>
<main>
  <section class="chat">
    <div id="log"></div>
    <form id="form">
      <input id="text" placeholder="Ask about an order, a policy, or request a return..." autocomplete="off" maxlength="1000">
      <button class="send" id="send">Send</button>
    </form>
  </section>
  <aside>
    <h2>Manager approvals</h2>
    <p class="hint">Cancellations, returns and tickets wait here until a manager decides.</p>
    <div id="actions"></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const make = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};

const STEP_LABEL = {
  router: "Understanding your question",
  orders: "Looking up your orders",
  policy: "Reading our policies",
  action: "Checking what we can do",
  responder: "Writing the answer",
  checker: "Double-checking the facts",
};
const INTENT_TEXT = {
  policy_question: "A question about our policies",
  order_question: "A question about your orders",
  eligibility_question: "Checking what is possible for your order",
  refund_request: "A return or refund request",
  cancel_request: "A cancellation request",
  ticket_request: "A problem you want to report",
  chitchat: "Just saying hello",
  out_of_scope: "Not about the store",
};
const ACTION_TEXT = {
  pending_approval: "Ready for manager approval",
  rejected: "Not allowed for this order",
  duplicate: "Found an existing ticket",
  needs_info: "Need the order number",
};
const SOURCE_NAME = {
  "returns.md": "Returns policy", "refunds.md": "Refunds policy", "shipping.md": "Shipping policy",
  "warranty.md": "Warranty policy", "cancellations.md": "Cancellation policy", "payments.md": "Payment policy",
  "loyalty.md": "Loyalty program", "support.md": "Support",
};
const SUGGESTIONS = [
  "Where is my latest order?",
  "How long do refunds take?",
  "Can I return something I bought?",
  "What is the warranty on a fan?",
];

const sourceName = (file) => SOURCE_NAME[file] || file.replace(/\.md$/, "");
const rupees = (n) => "₹" + Number(n).toLocaleString("en-IN");

let history = [];
let busy = false;
const cards = new Map();

function inline(parent, text) {
  for (const part of text.split(/(\*\*[^*]+\*\*)/)) {
    if (part.length > 4 && part.startsWith("**") && part.endsWith("**")) {
      parent.appendChild(make("strong", null, part.slice(2, -2)));
    } else if (part) {
      parent.appendChild(document.createTextNode(part.replace(/\*\*/g, "")));
    }
  }
}

function renderMarkdown(el, text) {
  el.replaceChildren();
  let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (bullet || numbered) {
      const tag = bullet ? "ul" : "ol";
      if (!list || list.tagName.toLowerCase() !== tag) {
        list = make(tag);
        el.appendChild(list);
      }
      const li = make("li");
      inline(li, (bullet || numbered)[1]);
      list.appendChild(li);
      continue;
    }
    list = null;
    if (!line.trim()) continue;
    const p = make("p");
    inline(p, line);
    el.appendChild(p);
  }
}

function scrollDown(force) {
  const log = $("log");
  if (force || log.scrollHeight - log.scrollTop - log.clientHeight < 140) log.scrollTop = log.scrollHeight;
}

function showWelcome() {
  const box = make("div", "welcome");
  box.id = "welcome";
  box.append(make("h2", null, "How can I help?"), make("p", null, "Ask about your orders, our policies, or request a return or cancellation."));
  const chips = make("div", "chips");
  for (const s of SUGGESTIONS) {
    const chip = make("button", "chip", s);
    chip.type = "button";
    chip.onclick = () => send(s);
    chips.appendChild(chip);
  }
  box.appendChild(chips);
  $("log").replaceChildren(box);
}

function userMessage(text) {
  const row = make("div", "row me");
  row.appendChild(make("div", "bubble", text));
  $("log").appendChild(row);
  scrollDown(true);
}

function actionCard(pa) {
  const card = make("div", "action-card");
  const title = pa.kind === "cancel" ? "Cancel order " + pa.order_id
    : pa.kind === "refund" ? "Return " + (pa.items || []).join(", ") + " · order " + pa.order_id
    : "Support ticket" + (pa.order_id ? " · order " + pa.order_id : "");
  const top = make("div", "top");
  const pill = make("span", "pill", "Waiting for manager approval");
  top.append(make("span", "title", title), pill);
  card.appendChild(top);
  const bits = [];
  if (pa.amount) bits.push("Refund " + rupees(pa.amount));
  if (pa.subject) bits.push(pa.subject);
  bits.push("Request #" + pa.action_id);
  card.appendChild(make("div", "sub", bits.join(" · ")));
  cards.set(pa.action_id, pill);
  return card;
}

function botMessage() {
  const row = make("div", "row bot");
  const bubble = make("div", "bubble");
  const thinking = make("div", "thinking");
  const title = make("div", "title");
  const dots = make("span", "dots");
  dots.append(make("span"), make("span"), make("span"));
  title.append(dots, make("span", null, "Thinking"));
  const stepList = make("div");
  thinking.append(title, stepList);
  const text = make("div", "text");
  const status = make("div", "status");
  const extras = make("div", "extras");
  bubble.append(thinking, text, status, extras);
  row.append(make("div", "avatar", "S"), bubble);
  $("log").appendChild(row);
  scrollDown(true);

  const steps = {};
  let buffer = "";
  let started = false;
  let queued = false;

  const paint = () => {
    queued = false;
    renderMarkdown(text, buffer);
    scrollDown();
  };
  const repaint = () => {
    if (!queued) {
      queued = true;
      requestAnimationFrame(paint);
    }
  };
  const setStatus = (label) => {
    status.replaceChildren();
    if (label) status.append(make("span", "mark"), make("span", null, label));
    status.classList.toggle("on", !!label);
  };
  const detailText = (step, d) => {
    if (step === "router") return INTENT_TEXT[d] || "";
    if (step === "orders") return d == null ? "" : d === 0 ? "Nothing found on your account" : d + (d === 1 ? " record found" : " records found");
    if (step === "policy") return (d || []).map(sourceName).join(", ");
    if (step === "action") return ACTION_TEXT[d] || "";
    return "";
  };

  return {
    step(ev) {
      if (ev.step === "checker") {
        if (ev.state === "start") setStatus(STEP_LABEL.checker + "...");
        else setStatus(ev.detail ? "" : "Found a mistake, fixing it...");
        return;
      }
      if (started) {
        if (ev.step === "responder" && ev.state === "start") setStatus("Rewriting the answer...");
        return;
      }
      if (ev.state === "start") {
        const line = make("div", "step");
        line.append(make("span", "mark"), make("span", "label", STEP_LABEL[ev.step] || ev.step), make("span", "detail"));
        line.querySelector(".detail").hidden = true;
        stepList.appendChild(line);
        steps[ev.step] = line;
      } else if (steps[ev.step]) {
        const line = steps[ev.step];
        line.classList.add("done");
        const note = detailText(ev.step, ev.detail);
        const slot = line.querySelector(".detail");
        slot.textContent = note;
        slot.hidden = !note;
      }
      scrollDown();
    },
    token(piece) {
      if (!started) {
        started = true;
        thinking.remove();
        text.classList.add("streaming");
      }
      buffer += piece;
      repaint();
    },
    restart() {
      buffer = "";
      repaint();
    },
    done(payload) {
      thinking.remove();
      setStatus("");
      text.classList.remove("streaming");
      buffer = payload.answer || buffer;
      renderMarkdown(text, buffer);
      const files = [...new Set((payload.sources || []).map((s) => s.split(" > ")[0]))];
      if (files.length) {
        const box = make("div", "sources");
        box.appendChild(make("span", null, "From"));
        for (const f of files) box.appendChild(make("span", "src", sourceName(f)));
        extras.appendChild(box);
      }
      if (payload.pending_action) extras.appendChild(actionCard(payload.pending_action));
      scrollDown(true);
      return buffer;
    },
    fail(message) {
      thinking.remove();
      setStatus("");
      text.classList.remove("streaming");
      text.replaceChildren(make("p", "error", message));
    },
  };
}

async function send(message) {
  message = (message || "").trim();
  if (!message || busy) return;
  busy = true;
  $("send").disabled = true;
  $("text").value = "";
  const welcome = $("welcome");
  if (welcome) welcome.remove();
  userMessage(message);
  const bot = botMessage();
  let answer = "";
  try {
    const res = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: Number($("customer").value), message, history }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "Something went wrong (" + res.status + ")");
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let pending = "";
    let finished = false;
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      pending += decoder.decode(value, { stream: true });
      let end;
      while ((end = pending.indexOf("\n\n")) >= 0) {
        const chunk = pending.slice(0, end);
        pending = pending.slice(end + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type === "step") bot.step(ev);
        else if (ev.type === "token") bot.token(ev.text);
        else if (ev.type === "restart") bot.restart();
        else if (ev.type === "error") throw new Error(ev.message);
        else if (ev.type === "done") {
          answer = bot.done(ev);
          finished = true;
        }
      }
    }
    if (!finished) throw new Error("The connection closed before the answer was finished.");
    history.push({ role: "user", content: message }, { role: "assistant", content: answer });
    history = history.slice(-8);
    loadActions();
  } catch (err) {
    bot.fail(err.message || "Something went wrong.");
  }
  busy = false;
  $("send").disabled = false;
  $("text").focus();
}

async function loadActions() {
  let rows = [];
  try {
    rows = await (await fetch("/actions")).json();
  } catch (e) {
    return;
  }
  const host = $("actions");
  host.replaceChildren();
  if (!rows.length) {
    host.appendChild(make("div", "empty", "Nothing waiting."));
    return;
  }
  for (const a of rows) {
    const p = a.payload;
    const what = a.kind === "cancel" ? "Cancel order " + a.order_id + " · refund " + rupees(p.refund_amount)
      : a.kind === "refund" ? "Return " + p.items.join(", ") + " from order " + a.order_id + " · refund " + rupees(p.refund_amount)
      : "Open a ticket" + (a.order_id ? " for order " + a.order_id : "") + ": " + p.subject;
    const card = make("div", "approval");
    card.append(make("div", "who", "Request #" + a.id + " · customer " + a.customer_id), make("div", "what", what));
    const btns = make("div", "btns");
    for (const [label, decision] of [["Approve", "approve"], ["Reject", "reject"]]) {
      const b = make("button", decision === "approve" ? "go" : "", label);
      b.onclick = async () => {
        btns.querySelectorAll("button").forEach((x) => (x.disabled = true));
        const out = await (await fetch("/actions/" + a.id + "/" + decision, { method: "POST" })).json();
        const pill = cards.get(a.id);
        if (pill) {
          const approved = out.status === "approved";
          pill.textContent = approved ? "Approved" : "Rejected";
          pill.className = "pill " + (approved ? "ok" : "bad");
        }
        loadActions();
      };
      btns.appendChild(b);
    }
    card.appendChild(btns);
    host.appendChild(card);
  }
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  send($("text").value);
};
$("customer").onchange = () => {
  history = [];
  showWelcome();
};

(async () => {
  showWelcome();
  const res = await fetch("/customers");
  for (const c of await res.json()) {
    const o = make("option", null, c.name + " (" + c.city + ", " + c.tier + ")");
    o.value = c.id;
    $("customer").appendChild(o);
  }
  loadActions();
  $("text").focus();
})();
</script>
</body>
</html>
